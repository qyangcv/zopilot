name: PDF Helper

on:
  push:
    tags:
      - pdf-helper-v**

permissions:
  contents: read

concurrency:
  group: pdf-helper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: Validate release metadata
        shell: bash
        run: |
          node scripts/pdf-helper.mjs verify-tag "${GITHUB_REF_NAME}"
          VERSION="$(node scripts/pdf-helper.mjs version)"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    needs:
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            helpers/pdf-helper/requirements.txt
            helpers/pdf-helper/requirements-build.txt
      - name: Build helper
        run: npm run build:pdf-helper -- --platform ${{ matrix.platform }}
      - name: Upload helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-helper-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/pdf-helper/zopilot-pdf-helper-${{ matrix.platform }}-v${{ needs.validate.outputs.version }}.zip
            dist/pdf-helper/pdf-helper-artifact-${{ matrix.platform }}.json

  publish:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download helper artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/pdf-helper/downloaded
      - name: Assemble release
        run: >-
          python scripts/pdf_helper.py manifest
          --artifacts-dir dist/pdf-helper/downloaded
          --output-dir dist/pdf-helper
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOPILOT_PDF_HELPER_RELEASE_DIR: dist/pdf-helper
        run: npm run release:pdf-helper
