# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      agents-sdk:
        patterns:
          - "@openai/agents"
          - "@openai/agents-*"
        update-types:
          - "minor"
          - "patch"
      eslint-toolchain:
        patterns:
          - "eslint"
          - "@zotero-plugin/eslint-config"
        update-types:
          - "minor"
          - "patch"
      markdown-rendering:
        patterns:
          - "katex"
          - "markdown-it"
          - "sanitize-html"
          - "shiki"
          - "@types/katex"
          - "@types/markdown-it"
          - "@types/sanitize-html"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      test-runner:
        patterns:
          - "chai"
          - "mocha"
          - "@types/chai"
          - "@types/mocha"
        update-types:
          - "minor"
          - "patch"
